# Default values for ckodex-oskal.

replicaCount: 1

image:
  repository: ghcr.io/ckodex-labs/oskal-controller
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: "oskal-controller-manager"
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

leaderElection:
  enabled: true

metrics:
  port: 8080
  service:
    type: ClusterIP
    port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

probes:
  port: 8081

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

webhook:
  enabled: true
  mode: "enforcing"
  port: 8443
  caBundle: ""
  tlsSecretName: ""
  certManager:
    enabled: false
    issuerRef: ""
  service:
    type: ClusterIP
    port: 443
    targetPort: 8443
  failurePolicy: Fail
  namespaceSelector:
    matchExpressions:
      - key: ckodex.io/assurance-enforced
        operator: In
        values: ["true"]

evidenceStorage:
  mountPath: "/var/lib/oskal/evidence"
  sizeLimit: "1Gi"

persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: "10Gi"

