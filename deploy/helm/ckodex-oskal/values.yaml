# Default values for ckodex-oskal.

replicaCount: 1
# Empty preserves cluster-wide reconciliation. Set an explicit namespace to
# bound OSKAL resource reconciliation independently of source observation scope.
reconcileNamespace: ""

image:
  repository: ghcr.io/ckodex-labs/oskal-controller
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: "oskal-controller-manager"
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

leaderElection:
  enabled: true

metrics:
  port: 8080
  service:
    type: ClusterIP
    port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

probes:
  port: 8081

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

webhook:
  enabled: true
  mode: "enforcing"
  port: 8443
  caBundle: ""
  tlsSecretName: ""
  certManager:
    enabled: false
    issuerRef: ""
  service:
    type: ClusterIP
    port: 443
    targetPort: 8443
  failurePolicy: Fail
  namespaceSelector:
    matchExpressions:
      - key: ckodex.io/assurance-enforced
        operator: In
        values: ["true"]

evidenceStorage:
  mountPath: "/var/lib/oskal/evidence"
  sizeLimit: "1Gi"

# Pre-created configuration and credentials, mounted read-only. The JSON file
# names exact source endpoints, publisher identities, and mounted TLS paths.
sources:
  configMapName: ""
  configMapKey: "sources.json"
  tlsSecrets: []
  publicCAConfigMaps: []

persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: "10Gi"


# Grants for explicitly configured capture sources only. Empty lists grant none.
policyCapture:
  # Explicit ports matching opa.listen in the sources JSON; no default exposure.
  opaListeners: []
  reportSources: []
  # - group: openreports.io
  #   resource: reports
  #   namespace: observed
  # Cluster report resources must omit namespace.
  gatekeeperResources: []
  # - k8srequiredlabels
  configMapMetadataNamespaces: []
  # Kubernetes RBAC cannot restrict get to metadata fields. Enable only where
  # the controller may read ConfigMaps; source code requests metadata only.
