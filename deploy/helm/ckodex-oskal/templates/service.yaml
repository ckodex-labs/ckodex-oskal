apiVersion: v1
kind: Service
metadata:
  name: {{ include "ckodex-oskal.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ckodex-oskal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.metrics.service.type }}
  ports:
    - port: {{ .Values.metrics.service.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "ckodex-oskal.selectorLabels" . | nindent 4 }}
