{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ckodex-oskal.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ckodex-oskal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webhook.service.type }}
  ports:
    - port: {{ .Values.webhook.service.port }}
      targetPort: {{ .Values.webhook.service.targetPort }}
      protocol: TCP
      name: https
  selector:
    {{- include "ckodex-oskal.selectorLabels" . | nindent 4 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "ckodex-oskal.fullname" . }}-webhook
  labels:
    {{- include "ckodex-oskal.labels" . | nindent 4 }}
webhooks:
  - name: validate.oskal.ckodex.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 5
    failurePolicy: {{ .Values.webhook.failurePolicy | default "Fail" }}
    clientConfig:
      service:
        name: {{ include "ckodex-oskal.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: "/validate"
        port: {{ .Values.webhook.service.port }}
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: "Namespaced"
    namespaceSelector:
      {{- toYaml .Values.webhook.namespaceSelector | nindent 6 }}
{{- end }}
