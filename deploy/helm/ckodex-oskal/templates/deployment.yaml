apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ckodex-oskal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ckodex-oskal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ckodex-oskal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ckodex-oskal.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ckodex-oskal.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /oskal-controller
          args:
            - --leader-elect={{ .Values.leaderElection.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --health-probe-bind-address=:{{ .Values.probes.port }}
            - --evidence-dir={{ .Values.evidenceStorage.mountPath | default "/var/lib/oskal/evidence" }}
            {{- if .Values.webhook.enabled }}
            - --enable-webhook=true
            - --webhook-port={{ .Values.webhook.port }}
            - --webhook-service-name={{ include "ckodex-oskal.fullname" . }}-webhook
            - --webhook-namespace={{ .Release.Namespace }}
            - --webhook-mode={{ .Values.webhook.mode | default "enforcing" }}
            {{- if or .Values.webhook.tlsSecretName .Values.webhook.certManager.enabled }}
            - --webhook-tls-cert-file=/var/run/oskal-webhook/tls/tls.crt
            - --webhook-tls-key-file=/var/run/oskal-webhook/tls/tls.key
            {{- end }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: evidence-store
              mountPath: {{ .Values.evidenceStorage.mountPath | default "/var/lib/oskal/evidence" }}
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.webhook.enabled (or .Values.webhook.tlsSecretName .Values.webhook.certManager.enabled) }}
            - name: webhook-tls
              mountPath: /var/run/oskal-webhook/tls
              readOnly: true
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: probes
              containerPort: {{ .Values.probes.port }}
              protocol: TCP
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: evidence-store
          emptyDir:
            sizeLimit: {{ .Values.evidenceStorage.sizeLimit | default "1Gi" }}
        - name: tmp
          emptyDir:
            sizeLimit: "64Mi"
        {{- if and .Values.webhook.enabled (or .Values.webhook.tlsSecretName .Values.webhook.certManager.enabled) }}
        - name: webhook-tls
          secret:
            secretName: {{ .Values.webhook.tlsSecretName | default (printf "%s-webhook-tls" (include "ckodex-oskal.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
