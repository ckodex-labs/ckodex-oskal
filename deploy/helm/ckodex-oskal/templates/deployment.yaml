{{- if and .Values.webhook.enabled (not .Values.sources.configMapName) }}
{{- fail "enforcing admission requires sources.configMapName containing bound runtime sources; capture-only/read-only deployments must explicitly set webhook.enabled=false" }}
{{- end }}
{{- if and .Values.policyCapture.opaListeners (not .Values.sources.configMapName) }}
{{- fail "OPA listeners require sources.configMapName with matching authenticated OPA capture configuration" }}
{{- end }}
{{- $names := dict }}
{{- $ports := dict }}
{{- $_ := set $ports (toString .Values.metrics.port) true }}
{{- $_ := set $ports (toString .Values.probes.port) true }}
{{- if .Values.webhook.enabled }}
{{- $_ := set $ports (toString .Values.webhook.port) true }}
{{- end }}
{{- range .Values.policyCapture.opaListeners }}
{{- if or (hasKey $names .name) (hasKey $ports (toString .port)) }}
{{- fail "OPA listener names and ports must be unique and must not collide with controller ports" }}
{{- end }}
{{- $_ := set $names .name true }}
{{- $_ := set $ports (toString .port) true }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ckodex-oskal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ckodex-oskal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ckodex-oskal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ckodex-oskal.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ckodex-oskal.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /oskal-controller
          args:
            - --leader-elect={{ .Values.leaderElection.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --health-probe-bind-address=:{{ .Values.probes.port }}
            - --evidence-dir={{ .Values.evidenceStorage.mountPath | default "/var/lib/oskal/evidence" }}
            - --archive-max-bytes={{ .Values.archiveLimits.maxBytes | int64 }}
            - --archive-max-entries={{ .Values.archiveLimits.maxEntries | int }}
            - --enable-webhook={{ .Values.webhook.enabled }}
            {{- if .Values.reconcileNamespace }}
            - --namespace={{ .Values.reconcileNamespace }}
            {{- end }}
            {{- if .Values.sources.configMapName }}
            - --sources=/etc/oskal/sources/sources.json
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - --webhook-port={{ .Values.webhook.port }}
            - --webhook-service-name={{ include "ckodex-oskal.fullname" . }}-webhook
            - --webhook-namespace={{ .Release.Namespace }}
            - --webhook-mode={{ .Values.webhook.mode | default "enforcing" }}
            {{- if or .Values.webhook.tlsSecretName .Values.webhook.certManager.enabled }}
            - --webhook-tls-cert-file=/var/run/oskal-webhook/tls/tls.crt
            - --webhook-tls-key-file=/var/run/oskal-webhook/tls/tls.key
            {{- end }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: evidence-store
              mountPath: {{ .Values.evidenceStorage.mountPath | default "/var/lib/oskal/evidence" }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.sources.configMapName }}
            - name: sources
              mountPath: /etc/oskal/sources
              readOnly: true
            {{- end }}
            {{- range $index, $secret := .Values.sources.tlsSecrets }}
            - name: source-tls-{{ $index }}
              mountPath: /etc/oskal/source-tls/{{ . }}
              readOnly: true
            {{- end }}
            {{- range $index, $configMap := .Values.sources.publicCAConfigMaps }}
            - name: source-ca-{{ $index }}
              mountPath: /etc/oskal/source-ca/{{ . }}
              readOnly: true
            {{- end }}
            {{- if and .Values.webhook.enabled (or .Values.webhook.tlsSecretName .Values.webhook.certManager.enabled) }}
            - name: webhook-tls
              mountPath: /var/run/oskal-webhook/tls
              readOnly: true
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: probes
              containerPort: {{ .Values.probes.port }}
              protocol: TCP
            {{- range .Values.policyCapture.opaListeners }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: evidence-store
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-evidence" (include "ckodex-oskal.fullname" .)) }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.evidenceStorage.sizeLimit | default "1Gi" }}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: "64Mi"
        {{- if .Values.sources.configMapName }}
        - name: sources
          configMap:
            name: {{ .Values.sources.configMapName | quote }}
            items:
              - key: {{ .Values.sources.configMapKey | quote }}
                path: sources.json
        {{- end }}
        {{- range $index, $secret := .Values.sources.tlsSecrets }}
        - name: source-tls-{{ $index }}
          secret:
            secretName: {{ . | quote }}
            defaultMode: 0440
        {{- end }}
        {{- range $index, $configMap := .Values.sources.publicCAConfigMaps }}
        - name: source-ca-{{ $index }}
          configMap:
            name: {{ . | quote }}
        {{- end }}
        {{- if and .Values.webhook.enabled (or .Values.webhook.tlsSecretName .Values.webhook.certManager.enabled) }}
        - name: webhook-tls
          secret:
            secretName: {{ .Values.webhook.tlsSecretName | default (printf "%s-webhook-tls" (include "ckodex-oskal.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
