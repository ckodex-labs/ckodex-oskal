<!DOCTYPE html>
<html lang="en" data-theme="ledger">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Title }}{{ .Title }} &middot; {{ end }}{{ .Site.Title }}</title>
  <link rel="stylesheet" href="{{ "css/styles.css" | relURL }}">
  <link rel="icon" type="image/svg+xml" href="{{ "assets/logos/mark-a2-favicon.svg" | relURL }}">
  <style>
    /* ==========================================================================
       RESPONSIVE & TOUCH DESIGN OVERHAUL (CKODEX-DS-3 & CORTAIX-DS-1 Section 10)
       ========================================================================== */

    /* Fluid typography and measures */
    .ck-doc-header {
      margin-bottom: var(--ck-sp-6);
      padding-bottom: var(--ck-sp-4);
      border-bottom: 1px solid var(--ck-hairline);
    }
    .ck-doc-meta {
      font-family: var(--ck-ff-mono);
      font-size: 11px;
      color: var(--ck-fg-mute);
      display: flex;
      flex-wrap: wrap;
      gap: var(--ck-sp-2) var(--ck-sp-3);
      align-items: center;
      margin-bottom: var(--ck-sp-2);
      text-transform: uppercase;
    }
    .ck-doc-title {
      font-family: var(--ck-ff-serif);
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 400;
      color: var(--ck-fg-0);
      margin: 0 0 var(--ck-sp-2) 0;
      line-height: 1.2;
      word-break: break-word;
    }
    .ck-doc-desc {
      font-family: var(--ck-ff-sans);
      font-size: clamp(14px, 2vw, 16px);
      color: var(--ck-fg-mute);
      margin: 0;
      line-height: 1.5;
    }
    .ck-article-body {
      font-family: var(--ck-ff-sans);
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--ck-fg-0);
      max-width: var(--ck-measure);
      min-width: 0;
    }
    .ck-article-body h2 {
      font-family: var(--ck-ff-sans);
      font-size: clamp(18px, 3vw, 22px);
      font-weight: 600;
      margin: var(--ck-sp-8) 0 var(--ck-sp-3) 0;
      padding-bottom: var(--ck-sp-1);
      border-bottom: 1px solid var(--ck-hairline);
      color: var(--ck-fg-0);
    }
    .ck-article-body h3 {
      font-family: var(--ck-ff-sans);
      font-size: clamp(15px, 2.5vw, 17px);
      font-weight: 600;
      margin: var(--ck-sp-6) 0 var(--ck-sp-2) 0;
      color: var(--ck-fg-0);
    }
    .ck-article-body code:not(pre code) {
      font-family: var(--ck-ff-mono);
      font-size: 12.5px;
      padding: 1px 4px;
      background: var(--ck-bg-1);
      border: 1px solid var(--ck-hairline);
      border-radius: 0;
      word-break: break-word;
    }
    .ck-article-body pre {
      background: var(--ck-bg-1);
      border: 1px solid var(--ck-hairline);
      padding: var(--ck-sp-4);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      font-family: var(--ck-ff-mono);
      font-size: 12px;
      line-height: 1.5;
      margin: var(--ck-sp-4) 0;
      max-width: 100%;
    }
    
    /* Responsive Table Wrapper */
    .ck-article-body table {
      width: 100%;
      border-collapse: collapse;
      margin: var(--ck-sp-6) 0;
      font-size: 13px;
    }
    .ck-article-body th, .ck-article-body td {
      border: 1px solid var(--ck-hairline);
      padding: var(--ck-sp-2) var(--ck-sp-3);
      text-align: left;
    }
    .ck-article-body th {
      background: var(--ck-bg-1);
      font-family: var(--ck-ff-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Responsive Bento Grid */
    .ck-bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--ck-sp-4);
      margin: var(--ck-sp-6) 0;
    }
    .ck-bento-card {
      border: 1px solid var(--ck-hairline);
      background: var(--ck-bg-1);
      padding: var(--ck-sp-4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: border-color var(--ck-t-state) var(--ck-ease);
      min-height: 140px;
    }
    .ck-bento-card:hover {
      border-color: var(--ck-accent-rust);
    }

    /* Non-colliding, bulletproof receipt layout */
    .ck-receipt {
      display: grid !important;
      grid-template-columns: 2px 1fr !important;
      gap: 0 10px !important;
      align-items: stretch !important;
      min-width: 0 !important;
      width: 100% !important;
    }
    .ck-receipt__rule {
      width: 2px !important;
      background: var(--ck-hairline) !important;
      min-height: 100% !important;
    }
    .ck-receipt--proof > .ck-receipt__rule {
      background: var(--ck-proof-violet) !important;
    }
    .ck-receipt > div:not(.ck-receipt__rule) {
      min-width: 0 !important;
      overflow: hidden !important;
    }

    /* Breakpoint: <= 900px (Tablet & Mobile Stacking) */
    @media (max-width: 900px) {
      .ck-mobile-nav-toggle {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
      }
      .ck-header-status {
        display: none !important;
      }
      .ck-shell__nav {
        display: none;
        border-right: none !important;
        border-bottom: 1px solid var(--ck-hairline) !important;
        background: var(--ck-bg-1) !important;
      }
      .ck-shell__nav.ck-nav-open {
        display: block !important;
        position: static;
        width: 100% !important;
        max-height: 70vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .ck-shell__main {
        padding: var(--ck-sp-5) var(--ck-sp-4) var(--ck-sp-8) !important;
      }
      .ck-shell__margin {
        border-left: none !important;
        border-top: 1px solid var(--ck-hairline) !important;
        padding: var(--ck-sp-5) var(--ck-sp-4) var(--ck-sp-8) !important;
        width: 100% !important;
      }
      .ck-nav-link {
        padding: 8px 12px !important;
        font-size: 13px !important;
        min-height: 44px;
        display: flex !important;
        align-items: center;
      }
      .ck-bento-grid {
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)) !important;
        gap: var(--ck-sp-3) !important;
      }
    }

    /* Breakpoint: <= 560px (Small Mobile Phones) */
    @media (max-width: 560px) {
      .ck-header-badge, .ck-header-github {
        display: none !important;
      }
      .ck-bento-grid {
        grid-template-columns: 1fr !important;
      }
      .ck-shell__header {
        padding: 0 var(--ck-sp-3) !important;
      }
      .ck-shell__main {
        padding: var(--ck-sp-4) var(--ck-sp-3) var(--ck-sp-6) !important;
      }
      .ck-shell__margin {
        padding: var(--ck-sp-4) var(--ck-sp-3) var(--ck-sp-6) !important;
      }
      .ck-shell__footer {
        padding: var(--ck-sp-3) var(--ck-sp-3) !important;
      }
    }
  </style>
</head>
<body>
  <a class="ck-sr" href="#main">Skip to main content</a>
  <div class="ck-shell ck-shell--console">
    {{ partial "header.html" . }}
    {{ partial "nav.html" . }}
    <main class="ck-shell__main" id="main" role="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "margin.html" . }}
    {{ partial "footer.html" . }}
  </div>
  <script src="{{ "js/theme.js" | relURL }}"></script>
</body>
</html>
