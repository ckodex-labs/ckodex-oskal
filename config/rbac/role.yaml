apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oskal-controller-role
rules:
  # Assurance CRD access
  - apiGroups:
      - assurance.ckodex.io
    resources:
      - controlbindings
      - evidencecontracts
      - assurancepolicies
      - controlexceptions
      - assurancestates
      - capabilityleases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - assurance.ckodex.io
    resources:
      - controlbindings/status
      - evidencecontracts/status
      - assurancepolicies/status
      - controlexceptions/status
      - assurancestates/status
      - capabilityleases/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - assurance.ckodex.io
    resources:
      - controlbindings/finalizers
      - assurancestates/finalizers
    verbs:
      - update
  # Read-only observation of workloads & cluster namespaces (Section 52)
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
      - statefulsets
    verbs:
      - get
      - list
      - watch
  # Read-only observation of admission policies
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
    verbs:
      - get
      - list
      - watch
