name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.18.0

      - name: Build Multi-Architecture Binaries
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${BUILD_DATE}"

          # Target matrix
          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS=${PLATFORM%/*}
            GOARCH=${PLATFORM#*/}
            EXT=""
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi

            echo "Compiling for ${GOOS}/${GOARCH}..."

            # 1. oskal CLI
            CLI_BIN="dist/oskal-${GOOS}-${GOARCH}${EXT}"
            CGO_ENABLED=0 GOOS=${GOOS} GOARCH=${GOARCH} go build -trimpath -ldflags="${LDFLAGS}" -o "${CLI_BIN}" ./cmd/oskal

            # 2. oskal-controller (unix only)
            if [ "$GOOS" != "windows" ]; then
              CTRL_BIN="dist/oskal-controller-${GOOS}-${GOARCH}"
              CGO_ENABLED=0 GOOS=${GOOS} GOARCH=${GOARCH} go build -trimpath -ldflags="${LDFLAGS}" -o "${CTRL_BIN}" ./cmd/oskal-controller
            fi

            # Package tarball or zip
            ARCHIVE="dist/ckodex-oskal_${VERSION#v}_${GOOS}_${GOARCH}.tar.gz"
            if [ "$GOOS" = "windows" ]; then
              ARCHIVE="dist/ckodex-oskal_${VERSION#v}_${GOOS}_${GOARCH}.zip"
              zip -j "${ARCHIVE}" "${CLI_BIN}" LICENSE README.md
            else
              tar -czf "${ARCHIVE}" -C dist "oskal-${GOOS}-${GOARCH}" "oskal-controller-${GOOS}-${GOARCH}" -C ../ LICENSE README.md
            fi
          done

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum ckodex-oskal_*.* > checksums.txt
          cd ..

      - name: Generate CycloneDX SBOM with Syft
        run: |
          syft scan dir:. -o cyclonedx-json=dist/ckodex-oskal_${GITHUB_REF_NAME#v}_sbom.cyclonedx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ckodex-oskal_*.tar.gz
            dist/ckodex-oskal_*.zip
            dist/checksums.txt
            dist/*.json
          draft: false
          prerelease: false
          generate_release_notes: true
