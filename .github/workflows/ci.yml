name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ssdlc:
    name: Dagger SSDLC Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: "v0.21.9"

      - name: Dagger SSDLC All (Lint, ProtoCheck, Test, Scan, Build)
        run: dagger call all --source=.
