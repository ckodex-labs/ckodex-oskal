name: CI

on:
  push:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  go-checks:
    name: Build, vet, race tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -count=1 -race ./...
      - name: Install the existing linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint
        run: golangci-lint run ./...

  ssdlc:
    name: Dagger SSDLC Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "v0.21.11"

      - name: Dagger SSDLC All (Lint, ProtoCheck, Test, Scan, Build, Attest)
        run: dagger call all --source=.

      - name: Export SSDLC Evidence Bundle
        run: dagger call evidence --source=. export --path=./dist-evidence

      - name: Upload SSDLC Evidence Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssdlc-evidence-bundle
          path: ./dist-evidence/
