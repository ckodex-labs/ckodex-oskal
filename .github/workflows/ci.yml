name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ssdlc:
    name: Dagger SSDLC Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: "v0.21.9"

      - name: Dagger SSDLC All (Lint, ProtoCheck, Test, Scan, Build, Attest)
        run: dagger call all --source=.

      - name: Export SSDLC Evidence Bundle
        run: dagger call evidence --source=. export --path=./dist-evidence

      - name: Upload SSDLC Evidence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssdlc-evidence-bundle
          path: ./dist-evidence/
